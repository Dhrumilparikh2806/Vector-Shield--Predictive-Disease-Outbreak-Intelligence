services:
  # FastAPI backend, built from the existing Dockerfile.
  # The frontend deploys separately on Vercel (see frontend/vercel.json) —
  # Render's free static-site sleep behavior doesn't matter there, and Vercel's
  # free tier is faster for a plain Vite app.
  - type: web
    name: vectorshield-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      # Postgres connection string from Neon/Supabase (or any Postgres host).
      # Free-tier filesystems are ephemeral, so SQLite would lose all hospital
      # signups on every restart — this must point at a real hosted database.
      # Format: postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Long random string used to sign login tokens — generate one, don't reuse
      # the dev default. e.g. `openssl rand -hex 32`
      - key: JWT_SECRET_KEY
        sync: false
      # Master admin login — the account that approves/rejects hospital signups.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
